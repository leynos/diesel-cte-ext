name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The declared MSRV is exercised by a check of the library alone, on the
  # locked dependencies: one `cargo check`, not a second test run. The version
  # is read from Cargo.toml, so the manifest stays the only place it is written.
  msrv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # An assigned RUSTFLAGS replaces `.cargo/config.toml`'s rustflags, which
      # name the mold linker. This job does not install mold, and a check
      # links build scripts, so it runs with the platform linker.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the library on the MSRV
        run: |
          msrv="$(sed -n 's/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "${msrv}" ]; then
            echo "::error::Cargo.toml declares no rust-version, so there is no MSRV to check" >&2
            exit 1
          fi
          rustup toolchain install "${msrv}" --profile minimal --no-self-update
          cargo "+${msrv}" check --lib --locked --all-features
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@ab6505246c6b043b742a225e428e00448c0a37af
        with:
          install-mold: 'true'
      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@ab6505246c6b043b742a225e428e00448c0a37af
        with:
          version: "0.6.1"
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34
        with:
          globs: '**/*.md'
      - name: Spelling
        run: make spelling
      - name: Install the Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@ab6505246c6b043b742a225e428e00448c0a37af
      - name: Lint
        run: make lint
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test pg_worker preparation
        run: make test-prepare-pg-worker
      - name: Install tzdata for embedded PostgreSQL
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tzdata
      # Pull requests only: main's push is measured by coverage-main.yml, the
      # one workflow that writes the ratchet baseline. The lane publishes no
      # artefact and never contacts CodeScene.
      - name: Test and Measure Coverage
        if: github.event_name == 'pull_request'
        env:
          RUSTFLAGS: -D warnings
          TZDIR: /usr/share/zoneinfo
          GITHUB_TOKEN: ${{ github.token }}
        uses: leynos/shared-actions/.github/actions/generate-coverage@ab6505246c6b043b742a225e428e00448c0a37af
        with:
          output-path: lcov.info
          format: lcov
          # Preserve the pre-#334 behaviour (plain `cargo test`, no
          # nextest): the embedded PostgreSQL cluster generates a fresh
          # random superuser password per run while cluster state
          # persists, so any change to run cadence risks the same
          # "failed to connect to admin database" rerun trap the
          # mutation-testing workflow works around. Converting to
          # nextest is a separate, deliberately verified change.
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
          publish-artefact: 'false'
